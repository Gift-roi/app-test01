name: ci-cd
on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: docker build -t app-test01:test .

  cd:
    needs: ci            # ne déploie que si la CI est verte
    runs-on: self-hosted # runner installé dans ta VM
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: docker image prune -f
